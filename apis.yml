aid: dejbox
name: Dejbox (Refectory)
description: 'Dejbox is a French corporate-catering company founded in Lille in 2015 by Adrien
  Verhack and Vincent Dupied, acquired by the Carrefour Group in January 2020 and since
  rebranded as Refectory (refectory.fr). It delivers prepared, seasonal meals to employees of
  companies located in the peripheral zones of major French cities via a digital canteen
  (click-and-collect precommande before 10:30) and connected self-service fridges, controlling
  100% of its value chain through its own Manufactures and a national network of 23 logistics
  hubs. Originally surfaced as a Partech portfolio company, it operates in Bordeaux, Grenoble,
  Lille, Lyon, Nantes, Paris and other French cities. Its consumer platform runs on a public
  OAuth2/OIDC identity server (customers.refectory.fr) and an API gateway (gateway.refectory.fr).'
